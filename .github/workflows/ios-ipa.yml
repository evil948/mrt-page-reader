# Сборка MRT+.ipa на GitHub-hosted macOS (без локального Mac и без Azure).
# Артефакт: MRTPlus-unsigned.ipa → подпись на Windows через Sideloadly.

name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/MRTPlus.xcodeproj

      - name: Archive (unsigned) and pack IPA
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/MRTPlus.xcarchive"
          IPA_DIR="$RUNNER_TEMP/ipa"
          mkdir -p "$IPA_DIR"

          xcodebuild archive \
            -project ios/MRTPlus.xcodeproj \
            -scheme MRTPlus \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER=io.github.evil948.mrtplus

          APP="$ARCHIVE/Products/Applications/MRTPlus.app"
          test -d "$APP"

          PAYLOAD="$RUNNER_TEMP/Payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          cp -R "$APP" "$PAYLOAD/"
          (
            cd "$RUNNER_TEMP"
            zip -qr "$IPA_DIR/MRTPlus-unsigned.ipa" Payload
          )
          ls -lh "$IPA_DIR"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mrtplus-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
