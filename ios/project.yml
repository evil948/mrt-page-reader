name: MRTPlus
options:
  bundleIdPrefix: io.github.evil948
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "4"
targets:
  MRTPlus:
    type: application
    platform: iOS
    sources:
      - path: MRTPlus
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.evil948.mrtplus
        INFOPLIST_FILE: MRTPlus/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
    info:
      path: MRTPlus/Resources/Info.plist
      properties:
        UILaunchScreen: {}
